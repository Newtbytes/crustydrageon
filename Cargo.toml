[package]
name = "crustydrageon"
version = "0.1.0"
edition = "2024"

[dependencies]
contracts = "0.6.7"
cov-mark = { version = "2.2.0", features = ["enable"] }
itertools = "0.15.0"
derive_more = { version = "2.1.1", features = [
    "from",
    "display",
    "deref",
    "deref_mut",
    "is_variant",
    "into_iterator",
    "eq",
] }

[dev-dependencies]
rstest = "0.26.1"
rstest_reuse = "0.7.0"
proptest = "1.11.0"
proptest-derive = "0.8.0"
serial_test = "3.5.0"
